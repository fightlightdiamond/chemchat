version: '3.8'

services:
  # Test runner service
  workflow-validator:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://test:test@postgres:5432/chemchat_test
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - DOCKER_ENV=true
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command: ['npm', 'run', 'test:workflow']

  # PostgreSQL for testing
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: chemchat_test
    ports:
      - '5432:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d chemchat_test']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chemchat-test-network

  # Redis for testing
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chemchat-test-network

  # Elasticsearch for testing
  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_test_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - chemchat-test-network

  # Script validation runner
  script-validator:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://test:test@postgres:5432/chemchat_test
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command:
      [
        'npm',
        'run',
        'test:workflow',
        '--',
        '--testPathPattern=script-execution-validation.spec.ts',
      ]

  # Node version validator
  node-validator:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    networks:
      - chemchat-test-network
    command:
      [
        'npm',
        'run',
        'test:workflow',
        '--',
        '--testPathPattern=nodejs-version-consistency.spec.ts',
      ]

  # CI workflow validator
  ci-validator:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://test:test@postgres:5432/chemchat_test
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command:
      [
        'npm',
        'run',
        'test:workflow',
        '--',
        '--testPathPattern=ci-workflow-execution.spec.ts',
      ]

  # Complete workflow validator
  complete-validator:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://test:test@postgres:5432/chemchat_test
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command:
      [
        'npm',
        'run',
        'test:workflow',
        '--',
        '--testPathPattern=complete-workflow-execution.spec.ts',
      ]

  # Simple workflow validator (no external dependencies)
  simple-validator:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=test
      - DOCKER_ENV=true
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    networks:
      - chemchat-test-network
    command: ['npm', 'run', 'workflow:validate']

volumes:
  postgres_test_data:
  elasticsearch_test_data:

networks:
  chemchat-test-network:
    driver: bridge
