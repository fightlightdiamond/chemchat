version: '3.8'

services:
  # Comprehensive test runner for all validation tests
  comprehensive-validator:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: chemchat-comprehensive-validator
    env_file:
      - .env.test.docker
    volumes:
      - .:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command: ['npm', 'run', 'validate:comprehensive']

  # Script validation runner
  script-validator:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: chemchat-script-validator
    env_file:
      - .env.test.docker
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command: ['npm', 'run', 'validate:scripts']

  # Node.js version consistency validator
  nodejs-validator:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: chemchat-nodejs-validator
    env_file:
      - .env.test.docker
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    networks:
      - chemchat-test-network
    command: ['npm', 'run', 'validate:nodejs-version']

  # CI workflow validator
  ci-workflow-validator:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: chemchat-ci-validator
    env_file:
      - .env.test.docker
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command: ['npm', 'run', 'validate:ci-workflow']

  # Comprehensive workflow test suite
  workflow-test-suite:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: chemchat-workflow-tests
    env_file:
      - .env.test.docker
    volumes:
      - .:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command: ['npm', 'run', 'test:workflow:comprehensive']

  # Individual test runners for specific validation areas
  script-execution-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: chemchat-script-tests
    env_file:
      - .env.test.docker
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command:
      ['npm', 'test', '--', 'test/system/script-execution-validation.spec.ts']

  nodejs-version-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: chemchat-nodejs-tests
    env_file:
      - .env.test.docker
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    networks:
      - chemchat-test-network
    command:
      ['npm', 'test', '--', 'test/system/nodejs-version-consistency.spec.ts']

  workflow-validation-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: chemchat-workflow-validation-tests
    env_file:
      - .env.test.docker
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - chemchat-test-network
    command: ['npm', 'test', '--', 'test/system/workflow-validation.spec.ts']

  # PostgreSQL for testing
  postgres:
    image: postgres:15-alpine
    container_name: chemchat-test-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: chemchat_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d chemchat_test']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chemchat-test-network

  # Redis for testing
  redis:
    image: redis:7-alpine
    container_name: chemchat-test-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chemchat-test-network

  # Elasticsearch for testing
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: chemchat-test-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_test_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - chemchat-test-network

volumes:
  postgres_test_data:
  elasticsearch_test_data:

networks:
  chemchat-test-network:
    driver: bridge
